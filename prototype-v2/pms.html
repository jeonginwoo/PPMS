<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>PMS v4 프로토타입 v2</title>
<!-- ?v= 는 캐시 깨기용이다. file:// 에서는 새로고침해도 브라우저가 assets 를 다시 읽지 않아,
     고친 화면 대신 예전 화면을 보고 "안 고쳐졌다"고 판단하게 된다(2026-09-23 실측).
     assets 를 고치는 사이클마다 이 숫자를 올린다. -->
<link rel="stylesheet" href="assets/base.css?v=3">
<link rel="stylesheet" href="assets/v2.css?v=3">
</head>
<body>
<div class="shell">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>
<div id="modal"></div>
<!-- v1 파일(data.js · views.js)은 그대로 두고, v2 파일이 뒤에서 덮어쓴다.
     같은 이름으로 UI.route 를 다시 걸면 나중 것이 이긴다. -->
<script src="assets/data.js?v=3"></script>
<script src="assets/data-v2.js?v=3"></script>
<script src="assets/app.js?v=3"></script>
<script src="assets/views.js?v=3"></script>
<script src="assets/views-v2.js?v=3"></script>
</body>
</html>
